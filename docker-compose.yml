services:
  mailtrap:
    build: .
    image: mailtrap:latest
    container_name: mailtrap
    restart: unless-stopped
    ports:
      - "8025:8080"   # web UI
      - "25:2525"     # SMTP (change the left side if 25 is taken on the host)
    environment:
      MailTrap__PublicSmtpPort: "25"   # keep in sync with the host SMTP port above
      MailTrap__ServerName: "mailtrap.local"
      MailTrap__MaxMessageSizeMb: "50"
    volumes:
      - mailtrap-data:/data

volumes:
  mailtrap-data:
