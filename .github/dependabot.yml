version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      test-packages:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "Microsoft.Testing.*", "Microsoft.AspNetCore.Mvc.Testing", "MailKit"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
