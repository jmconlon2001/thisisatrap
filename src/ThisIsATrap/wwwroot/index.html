<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b1220" />
    <title>ThisIsATrap</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="img/logo-mark.svg" />
</head>
<body>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true" />
    <div class="app-shell">
        <aside class="sidebar" aria-label="Main navigation">
            <div class="sidebar-brand">
                <a href="./">
                    <img class="brand-mark" src="img/logo-mark.svg" alt="" />
                    <span class="brand-text">ThisIsATrap<small>Dev SMTP sink · nothing leaves</small></span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">Mailbox</div>
                <button type="button" class="nav-item-link active" data-folder="all"><i class="i i-mail"></i> All messages <span class="nav-count" id="count-all">0</span></button>
                <button type="button" class="nav-item-link" data-folder="unread"><i class="i i-dot-circle"></i> Unread <span class="nav-count" id="count-unread">0</span></button>
                <button type="button" class="nav-item-link" data-folder="attachments"><i class="i i-paperclip"></i> With attachments</button>

                <div class="nav-section nav-section-row">Inboxes <button type="button" class="nav-add" data-action="new-inbox" title="New inbox" aria-label="New inbox"><i class="i i-plus"></i></button></div>
                <div id="inbox-nav"></div>

                <div class="nav-section">System</div>
                <button type="button" class="nav-item-link" data-view="status"><i class="i i-activity"></i> Status &amp; health <span class="nav-health" id="nav-health"></span></button>
                <button type="button" class="nav-item-link" data-action="settings"><i class="i i-settings"></i> Settings &amp; auto-purge</button>
                <button type="button" class="nav-item-link" data-action="webhooks"><i class="i i-webhook"></i> Webhooks</button>
                <button type="button" class="nav-item-link" data-action="smtp-rules"><i class="i i-alert"></i> Error simulation</button>
                <button type="button" class="nav-item-link" data-action="connect"><i class="i i-info"></i> How to connect</button>
            </nav>
            <div class="sidebar-footer">
                <div class="smtp-card">
                    <div class="row"><span class="dot" id="smtp-dot"></span> <span id="smtp-status">SMTP</span></div>
                    <div class="addr" id="smtp-addr"></div>
                    <div class="hint">Every message is captured here. Nothing is relayed.</div>
                </div>
            </div>
        </aside>
        <label for="nav-toggle" class="sidebar-scrim" aria-hidden="true"></label>

        <div class="main">
            <header class="topbar">
                <label for="nav-toggle" class="icon-btn mobile-only" title="Menu"><i class="i i-menu"></i></label>
                <a class="topbar-brand" href="./"><img class="brand-mark" src="img/logo-mark.svg" alt="" /> <span class="desktop-only">ThisIsATrap</span></a>
                <div class="input-icon">
                    <i class="i i-search"></i>
                    <input id="search" class="form-control" type="search" placeholder="Search subject, sender, recipient, text…" autocomplete="off" />
                </div>
                <div class="topbar-spacer"></div>
                <span class="topbar-chip live" id="live-chip" title="Live updates"><span class="dot"></span> Connecting…</span>
                <button type="button" class="icon-btn" data-action="refresh" title="Refresh"><i class="i i-refresh"></i></button>
                <button type="button" class="icon-btn desktop-only" data-action="read-all" title="Mark all as read"><i class="i i-mail-open"></i></button>
                <button type="button" class="icon-btn danger" data-action="delete-all" title="Delete all messages"><i class="i i-trash"></i></button>
                <button type="button" class="icon-btn" data-theme-toggle title="Toggle light/dark theme" aria-label="Toggle theme">
                    <i class="i i-moon theme-dark-hide"></i><i class="i i-sun theme-light-hide"></i>
                </button>
            </header>

            <div class="mail" id="mail">
                <section class="pane list-pane" aria-label="Messages">
                    <div class="pane-header">
                        <h2 id="folder-title">All inboxes</h2>
                        <span class="meta" id="list-meta"></span>
                        <button type="button" class="icon-btn icon-btn-sm" data-action="inbox-settings" id="inbox-settings-btn" title="Inbox settings" hidden><i class="i i-settings"></i></button>
                    </div>
                    <div class="msg-list" id="msg-list"></div>
                </section>

                <section class="pane reader-pane" aria-label="Message">
                    <div class="reader" id="reader"></div>
                </section>
            </div>

            <section class="status-view" id="status-view" aria-label="Status and health" hidden></section>
        </div>
    </div>

    <div class="toast-stack" id="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script src="js/app.js"></script>
</body>
</html>
